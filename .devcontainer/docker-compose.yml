services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
  database:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722  # postgres:17
    environment:
      POSTGRES_USER: trax
      POSTGRES_PASSWORD: trax123
      POSTGRES_DB: trax
      POSTGRES_MULTIPLE_DATABASES: trax_scheduler_tests,trax_data_tests
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ../init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
